# See kitty.conf(5)

# colorscheme
include mocha.conf
background #11111b

# Fonts
font_family family="NotoSansM Nerd Font Mono"
font_size 13.0

# Cursor customization
cursor_shape beam
cursor_blink_interval 0

# Scrollback
wheel_scroll_multiplier 4.0
touch_scroll_multiplier 4.0

# Performance tuning
sync_to_monitor no

# Terminal bell
enable_audio_bell no

# Window layout
remember_window_size no

# Tab bar
tab_bar_edge top
tab_bar_style separator
tab_switch_strategy right
tab_separator "  "
active_tab_font_style normal

# Keyboard shortcuts
map page_down scroll_page_down
map ctrl+shift+down combine : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down
map page_up scroll_page_up
map ctrl+shift+up combine : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up
map ctrl+shift+k combine : clear_terminal scrollback active : clear_terminal to_cursor active
# open current directory
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
# Switch focus to the neighboring window in the indicated direction
map alt+left neighboring_window left
map alt+right neighboring_window right
map alt+up neighboring_window up
map alt+down neighboring_window down

# kitty-scrollback.nvim
allow_remote_control socket-only
listen_on unix:/tmp/kitty
shell_integration enabled
# Kitten alias
action_alias kitty_scrollback_nvim kitten /home/frank/.local/share/nvim/site/pack/core/opt/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
# Browse scrollback buffer in nvim
map kitty_mod+h kitty_scrollback_nvim
# Browse output of the last shell command in nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output
